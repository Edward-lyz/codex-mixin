<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">整体压缩与分段逐步替换</title><desc id="desc">相同的系统提示词、用户输入、模型输出与工具结果序列。传统压缩一次替换较大段历史；Mixin 分三步分别替换片段 A、片段 B，再合并摘要，同时保留原文归档。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#203047}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.small{font-size:16px;fill:#5c6c80}.label{font-size:18px}.sys{fill:#e9e5f5;stroke:#9180b6}.user{fill:#dcedfc;stroke:#6898c1}.model{fill:#e4edf0;stroke:#8b9fa8}.tool{fill:#fff0d3;stroke:#c8a260}.sum{fill:#ccebe1;stroke:#25846b}.box{stroke-width:1.5}.line{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="1120" fill="white"/><text x="48" y="60" class="title">同一段上下文，两种替换方式</text><text x="48" y="96" class="label">整体生成一份摘要，或按已完成的片段逐步压缩</text><rect x="32" y="135" width="1376" height="307" rx="14" fill="#f7f8fa"/><text x="56" y="180" class="head">传统压缩</text><text x="230" y="180" class="small">较大段历史 → 一份摘要（示意）</text><rect x="32" y="465" width="1376" height="565" rx="14" fill="#f3faf7"/><text x="56" y="510" class="head">Mixin 分段压缩</text><text x="290" y="510" class="small">片段 A → 片段 B → 摘要合并；每一步只替换选中的范围</text><text x="56" y="264" class="label">压缩前</text><rect x="190" y="230" width="130" height="58" rx="7" class="box sys"/><text x="255" y="265" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="230" width="88" height="58" rx="7" class="box user"/><text x="374" y="265" text-anchor="middle" class="small">用户输入</text><rect x="428" y="230" width="88" height="58" rx="7" class="box model"/><text x="472" y="265" text-anchor="middle" class="small">模型输出</text><rect x="526" y="230" width="88" height="58" rx="7" class="box tool"/><text x="570" y="265" text-anchor="middle" class="small">工具结果</text><rect x="624" y="230" width="88" height="58" rx="7" class="box model"/><text x="668" y="265" text-anchor="middle" class="small">模型输出</text><rect x="722" y="230" width="88" height="58" rx="7" class="box user"/><text x="766" y="265" text-anchor="middle" class="small">用户输入</text><rect x="820" y="230" width="88" height="58" rx="7" class="box model"/><text x="864" y="265" text-anchor="middle" class="small">模型输出</text><rect x="918" y="230" width="88" height="58" rx="7" class="box tool"/><text x="962" y="265" text-anchor="middle" class="small">工具结果</text><rect x="1016" y="230" width="88" height="58" rx="7" class="box model"/><text x="1060" y="265" text-anchor="middle" class="small">模型输出</text><rect x="1114" y="230" width="88" height="58" rx="7" class="box user"/><text x="1158" y="265" text-anchor="middle" class="small">用户输入</text><rect x="1212" y="230" width="88" height="58" rx="7" class="box model"/><text x="1256" y="265" text-anchor="middle" class="small">模型输出</text><text x="56" y="394" class="label">一次替换</text><rect x="190" y="360" width="130" height="58" rx="7" class="box sys"/><text x="255" y="395" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="360" width="210" height="58" rx="7" class="box sum"/><text x="435" y="395" text-anchor="middle" class="small">整段历史摘要</text><rect x="550" y="360" width="88" height="58" rx="7" class="box user"/><text x="594" y="395" text-anchor="middle" class="small">用户输入</text><rect x="648" y="360" width="88" height="58" rx="7" class="box model"/><text x="692" y="395" text-anchor="middle" class="small">模型输出</text><text x="56" y="609" class="label">初始</text><rect x="190" y="575" width="130" height="58" rx="7" class="box sys"/><text x="255" y="610" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="575" width="88" height="58" rx="7" class="box user"/><text x="374" y="610" text-anchor="middle" class="small">用户输入</text><rect x="428" y="575" width="88" height="58" rx="7" class="box model"/><text x="472" y="610" text-anchor="middle" class="small">模型输出</text><rect x="526" y="575" width="88" height="58" rx="7" class="box tool"/><text x="570" y="610" text-anchor="middle" class="small">工具结果</text><rect x="624" y="575" width="88" height="58" rx="7" class="box model"/><text x="668" y="610" text-anchor="middle" class="small">模型输出</text><rect x="722" y="575" width="88" height="58" rx="7" class="box user"/><text x="766" y="610" text-anchor="middle" class="small">用户输入</text><rect x="820" y="575" width="88" height="58" rx="7" class="box model"/><text x="864" y="610" text-anchor="middle" class="small">模型输出</text><rect x="918" y="575" width="88" height="58" rx="7" class="box tool"/><text x="962" y="610" text-anchor="middle" class="small">工具结果</text><rect x="1016" y="575" width="88" height="58" rx="7" class="box model"/><text x="1060" y="610" text-anchor="middle" class="small">模型输出</text><rect x="1114" y="575" width="88" height="58" rx="7" class="box user"/><text x="1158" y="610" text-anchor="middle" class="small">用户输入</text><rect x="1212" y="575" width="88" height="58" rx="7" class="box model"/><text x="1256" y="610" text-anchor="middle" class="small">模型输出</text><text x="56" y="734" class="label">第 1 步</text><rect x="190" y="700" width="130" height="58" rx="7" class="box sys"/><text x="255" y="735" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="700" width="145" height="58" rx="7" class="box sum"/><text x="402.5" y="735" text-anchor="middle" class="small">摘要 A</text><rect x="485" y="700" width="88" height="58" rx="7" class="box user"/><text x="529" y="735" text-anchor="middle" class="small">用户输入</text><rect x="583" y="700" width="88" height="58" rx="7" class="box model"/><text x="627" y="735" text-anchor="middle" class="small">模型输出</text><rect x="681" y="700" width="88" height="58" rx="7" class="box tool"/><text x="725" y="735" text-anchor="middle" class="small">工具结果</text><rect x="779" y="700" width="88" height="58" rx="7" class="box model"/><text x="823" y="735" text-anchor="middle" class="small">模型输出</text><rect x="877" y="700" width="88" height="58" rx="7" class="box user"/><text x="921" y="735" text-anchor="middle" class="small">用户输入</text><rect x="975" y="700" width="88" height="58" rx="7" class="box model"/><text x="1019" y="735" text-anchor="middle" class="small">模型输出</text><text x="56" y="859" class="label">第 2 步</text><rect x="190" y="825" width="130" height="58" rx="7" class="box sys"/><text x="255" y="860" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="825" width="145" height="58" rx="7" class="box sum"/><text x="402.5" y="860" text-anchor="middle" class="small">摘要 A</text><rect x="485" y="825" width="145" height="58" rx="7" class="box sum"/><text x="557.5" y="860" text-anchor="middle" class="small">摘要 B</text><rect x="640" y="825" width="88" height="58" rx="7" class="box user"/><text x="684" y="860" text-anchor="middle" class="small">用户输入</text><rect x="738" y="825" width="88" height="58" rx="7" class="box model"/><text x="782" y="860" text-anchor="middle" class="small">模型输出</text><text x="56" y="984" class="label">第 3 步</text><rect x="190" y="950" width="130" height="58" rx="7" class="box sys"/><text x="255" y="985" text-anchor="middle" class="label">系统提示词</text><rect x="330" y="950" width="210" height="58" rx="7" class="box sum"/><text x="435" y="985" text-anchor="middle" class="small">摘要 AB</text><rect x="550" y="950" width="88" height="58" rx="7" class="box user"/><text x="594" y="985" text-anchor="middle" class="small">用户输入</text><rect x="648" y="950" width="88" height="58" rx="7" class="box model"/><text x="692" y="985" text-anchor="middle" class="small">模型输出</text><rect x="325" y="222" width="784" height="74" rx="10" fill="none" stroke="#b8853c" stroke-width="2" stroke-dasharray="6 4"/><path d="M715 301V324H435V351" class="line"/><text x="740" y="328" class="small">历史整体替换，近期消息保留</text><rect x="325" y="567" width="392" height="74" rx="10" fill="none" stroke="#25846b" stroke-width="2" stroke-dasharray="6 4"/><path d="M520 646V670H402V691" class="line"/><text x="750" y="668" class="small">① 仅压缩已消费的片段 A</text><rect x="480" y="692" width="392" height="74" rx="10" fill="none" stroke="#25846b" stroke-width="2" stroke-dasharray="6 4"/><path d="M675 772V792H558V816" class="line"/><text x="905" y="793" class="small">② 再替换片段 B</text><rect x="325" y="817" width="315" height="74" rx="10" fill="none" stroke="#25846b" stroke-width="2" stroke-dasharray="6 4"/><path d="M480 897V920H435V941" class="line"/><text x="690" y="920" class="small">③ A + B → 更高层摘要；未选中内容继续保留</text><text x="850" y="984" class="label" fill="#25846b">原文独立归档 ↔ 搜索 / 查看 / 恢复</text><text x="48" y="1068" class="small">系统提示词单独展示并保留。传统路线是概念示意，不代表所有产品实现；方块宽度不表示 token 数。</text><text x="48" y="1098" class="small">Mixin：原文 → T1 → T2 → T3；保护区及工具调用配对受校验。分层策略参考 Billion Context（MIT）。详见 Wiki。</text></svg>