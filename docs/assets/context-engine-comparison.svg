<rect x="926" y="599" width="66" height="66" rx="6" fill="#E0EEF8" stroke="#0072B2"/><text x="959" y="639" text-anchor="middle" class="label b">T1</text>
<use href="#page" x="1006" y="599"/><use href="#recent" x="1064" y="599"/>
<path d="M1136 632H1234" class="flow"/><use href="#model" x="1260" y="594"/>
<path d="M477 675V720" class="flow"/>
<path d="M330 746C330 724 624 724 624 746V821C624 844 330 844 330 821Z" fill="#fff" stroke="#0072B2" stroke-width="2"/><ellipse cx="477" cy="746" rx="147" ry="17" fill="#E0EEF8" stroke="#0072B2" stroke-width="2"/>
<text x="477" y="794" text-anchor="middle" class="label b">Original archive</text><text x="477" y="819" text-anchor="middle" class="small">Every compressed range</text>
