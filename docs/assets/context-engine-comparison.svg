<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Context compaction — summaries and recoverable history</title>
<desc id="desc">Three schematic rows compare Codex compaction, Claude Code summaries, and Mixin selective hierarchical compression. Mixin keeps an independent original archive and provides a return path to detail. Native compaction rows depict model context only, not deletion of logs. Block sizes are illustrative, not measurements. Sources and routing scope are in the accompanying Wiki.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#667585"/></marker>
 <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0072B2"/></marker>
 <pattern id="lines" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M3 6H20" stroke="#93A3B2" stroke-width="2"/></pattern>
 <g id="page"><rect width="48" height="66" rx="5" fill="#EDF1F5" stroke="#A5B1BD"/><rect x="9" y="12" width="30" height="42" fill="url(#lines)"/></g>
 <g id="recent"><rect width="48" height="66" rx="5" fill="#E0F3EB" stroke="#27846A"/><path d="M12 23H36M12 34H36M12 45H28" stroke="#27846A" stroke-width="2"/></g>
 <g id="history"><use href="#page"/><use href="#page" x="58"/><use href="#page" x="116"/><use href="#page" x="174"/><use href="#recent" x="232"/><use href="#recent" x="290"/></g>
 <g id="model"><rect width="76" height="76" rx="18" fill="#fff" stroke="#667585" stroke-width="2"/><circle cx="24" cy="29" r="4" fill="#667585"/><circle cx="52" cy="29" r="4" fill="#667585"/><path d="M23 49H53M38 -8V0" stroke="#667585" stroke-width="3"/><circle cx="38" cy="-11" r="4" fill="#667585"/></g>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#203040}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#637383}.b{fill:#0072B2}.flow{fill:none;stroke:#667585;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#0072B2;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#blue)}</style>
</defs>
<rect width="1440" height="1040" fill="#fff"/>
<text x="48" y="61" class="title">Less context. A path back to detail.</text>
<text x="48" y="94" class="label" fill="#637383">Context compaction · mechanism comparison</text>
<text x="308" y="145" class="small">CONVERSATION</text><text x="864" y="145" class="small">WORKING CONTEXT</text><text x="1260" y="145" class="small">MODEL</text>
<!-- Native mechanisms: context transformation, not storage deletion. -->
<rect x="32" y="165" width="1376" height="176" rx="12" fill="#F8F9FB"/>
<text x="56" y="215" class="head">a  Codex</text><text x="56" y="245" class="small">Built-in compaction</text>
<use href="#history" x="308" y="215"/>
<path d="M670 248H826" class="flow"/><text x="748" y="229" text-anchor="middle" class="small">compact</text>
<rect x="850" y="215" width="142" height="66" rx="6" fill="#F6E8D2" stroke="#B47A2F"/>
<text x="921" y="242" text-anchor="middle" class="label">Compact</text><text x="921" y="265" text-anchor="middle" class="small">representation*</text>
<use href="#recent" x="1006" y="215"/><use href="#recent" x="1064" y="215"/>
<path d="M1136 248H1234" class="flow"/><use href="#model" x="1260" y="210"/>
<rect x="32" y="357" width="1376" height="176" rx="12" fill="#F8F9FB"/>
<text x="56" y="407" class="head">b  Claude Code</text><text x="56" y="437" class="small">Built-in compaction</text>
<use href="#history" x="308" y="407"/>
<path d="M670 440H826" class="flow"/><text x="748" y="421" text-anchor="middle" class="small">summarize</text>
<rect x="850" y="407" width="142" height="66" rx="6" fill="#F6E8D2" stroke="#B47A2F"/>
<text x="921" y="446" text-anchor="middle" class="label">Summary</text>
<use href="#recent" x="1006" y="407"/><use href="#recent" x="1064" y="407"/>
<path d="M1136 440H1234" class="flow"/><use href="#model" x="1260" y="402"/>
<!-- Mixin keeps storage and working context separate. -->
<rect x="32" y="549" width="1376" height="344" rx="12" fill="#F4F9FD" stroke="#B7D7E9"/>
<text x="56" y="599" class="head">c  Codex Mixin</text><text x="56" y="629" class="small">Selective + recoverable</text>
<use href="#history" x="308" y="599"/>
<path d="M670 632H826" class="flow"/><text x="748" y="613" text-anchor="middle" class="small">select + compress</text>
