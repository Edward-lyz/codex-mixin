name: Windows

on:
  workflow_dispatch:
    inputs:
      ui_artifact_run:
        description: 'Re-run UI tests with native UI and CLI artifacts from this Windows run ID'
        required: false
        type: string
      cli_artifact_run:
        description: 'Optional CLI artifact run ID when re-running native UI artifacts'
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.ui_artifact_run }}
  cancel-in-progress: true

jobs:
  rust:
    if: ${{ !inputs.ui_artifact_run }}
    name: Rust tests (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - unit
          - integration-a
          - integration-b
          - integration-c
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - name: Run strict Clippy
        if: matrix.shard == 'unit'
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      # The unit shard and three integration shards together cover the same
      # targets as --all-targets. Integration binaries are the long pole, so
      # they run beside the unit harnesses instead of after them.
      - name: Run unit tests
        if: matrix.shard == 'unit'
        run: cargo test --locked --lib --bins --examples
      - name: Run integration tests
        if: startsWith(matrix.shard, 'integration-')
        shell: pwsh
        run: ./scripts/test_windows_integration.ps1 -Shard ${{ matrix.shard }}
  cli:
    if: ${{ !inputs.ui_artifact_run }}
    name: Build Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cli
          path: target/release/codex-mixin.exe
          if-no-files-found: error

  native:
    if: ${{ !inputs.ui_artifact_run }}
    name: WinUI 3 build and adapter tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path scripts, windows/scripts -Recurse -Filter *.ps1
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed: $($script.FullName)"
            }
          }
      - name: Test CLI adapter
        shell: pwsh
        run: dotnet run --project windows/Tests/Tests.csproj -c Release
      - name: Compile UI automation harness
        shell: pwsh
        run: dotnet build windows/UiTests/UiTests.csproj -c Release
      - name: Generate native icons
        shell: pwsh
        run: ./windows/scripts/generate-windows-assets.ps1
      - name: Compile and publish native UI
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $version = [regex]::Match(
            $cargo, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if (-not $version) { throw 'Cargo package version is missing' }
          $numericVersion = ($version -split '-', 2)[0]
          dotnet publish windows/CodexMixin/CodexMixin.csproj -c Release `
            -p:Platform=x64 -p:Version=$numericVersion -o windows/build/publish
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-ui
          path: windows/build/publish
          if-no-files-found: error

  native-ui:
    if: ${{ always() && (inputs.ui_artifact_run || (needs.cli.result == 'success' && needs.native.result == 'success')) }}
    name: Windows native UI and real CLI tests
    runs-on: windows-latest
    needs: [cli, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: target/release
          run-id: ${{ inputs.cli_artifact_run || inputs.ui_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-ui
          path: windows/build/publish
          run-id: ${{ inputs.ui_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Test real Rust CLI contracts
        shell: pwsh
        run: dotnet run --project windows/Tests/Tests.csproj -c Release -- --cli-only target/release/codex-mixin.exe
      - name: Stage real CLI alongside UI
        shell: pwsh
        run: Copy-Item target/release/codex-mixin.exe windows/build/publish/
      - name: Test native navigation, themes, tray and activation
        shell: pwsh
        run: |
          $dumpPath = Join-Path $env:RUNNER_TEMP 'native-dumps'
          New-Item -ItemType Directory -Force $dumpPath | Out-Null
          New-Item -ItemType Directory -Force windows/build/ui-test-artifacts | Out-Null
          $key = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\codex_mixin_ui.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumpPath -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          dotnet run --project windows/UiTests/UiTests.csproj -c Release -- windows/build/publish/codex_mixin_ui.exe windows/build/ui-test-artifacts
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} |
              Where-Object { $_.Message -match 'codex_mixin_ui|Microsoft.UI.Xaml' } |
              Format-List TimeCreated,Id,Message | Out-File windows/build/ui-test-artifacts/native-events.txt
            $dumps = @(Get-ChildItem -LiteralPath $dumpPath -Filter *.dmp -ErrorAction SilentlyContinue)
            if ($dumps.Count -gt 0) {
              $debugger = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
              if (-not (Test-Path $debugger)) { throw 'Native crash debugger is missing from Windows runner' }
              dotnet run --project windows/UiTests/UiTests.csproj -c Release -- windows/build/publish/codex_mixin_ui.exe windows/build/ui-test-artifacts/debugger $debugger
            } else {
              Write-Host 'No native crash dump; preserving the original UI test failure without debugger replay.'
            }
          }
          exit $testExit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-native-crash-dumps
          path: ${{ runner.temp }}/native-dumps/*.dmp
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-ui-evidence
          path: |
            windows/build/ui-test-artifacts/*.png
            windows/build/ui-test-artifacts/resources.json
            windows/build/ui-test-artifacts/index.html
            windows/build/ui-test-artifacts/failure.txt
            windows/build/ui-test-artifacts/native-errors.txt
            windows/build/ui-test-artifacts/native-events.txt
            windows/build/ui-test-artifacts/native-debugger.txt
            windows/build/ui-test-artifacts/debugger/failure.txt
            windows/build/ui-test-artifacts/debugger/native-debugger.txt
          retention-days: 14
          if-no-files-found: warn

  package:
    if: ${{ !inputs.ui_artifact_run }}
    runs-on: windows-latest
    needs: [rust, cli, native-ui]
    steps:
      - uses: actions/checkout@v5
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $version = [regex]::Match(
            $cargo, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if (-not $version) { throw 'Cargo package version is missing' }
          "value=$version" >> $env:GITHUB_OUTPUT
      # Package the CLI built by the cli job instead of rebuilding it.
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: windows-cli
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-ui
          path: windows-ui
      # NSIS provides makensis for the standard installer built by the script.
      - name: Install NSIS
        run: ./windows/scripts/install-nsis.ps1
        shell: pwsh
      # Reuses the tested CLI and native UI artifacts, then exercises the same
      # installer and portable archive paths as the release workflow.
      - name: Package and optionally sign Windows artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:VERSION
          $options = @{
            Output = "dist\release\codex-mixin-$version-windows-x86_64"
            Installer = "dist\release\codex-mixin-$version-windows-x86_64-setup.exe"
            PortableArchive = "dist\release\codex-mixin-$version-windows-x86_64.zip"
            Version = $version
            CliPath = 'windows-cli\codex-mixin.exe'
            UiPath = 'windows-ui'
            SkipCliTests = $true
          }
          $pfx = $null
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codex-mixin.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $options.Sign = $true
            $options.CertificatePath = $pfx
            $options.CertificatePassword = $env:WINDOWS_CERT_PASSWORD
          }
          try {
            & windows/scripts/package-windows.ps1 @options
          } finally {
            if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }
      # Fail the job if either executable is missing from the package.
      - shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $app = "dist\release\codex-mixin-$version-windows-x86_64"
          if (-not (Test-Path "$app\codex-mixin.exe")) { throw 'codex-mixin.exe missing from package' }
          if (-not (Test-Path "$app\codex_mixin_ui.exe")) { throw 'codex_mixin_ui.exe missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64-setup.exe")) { throw 'Windows installer missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64.zip")) { throw 'Windows portable archive missing from package' }
      - name: Test complete installer upgrade and startup preservation
        shell: pwsh
        run: ./windows/scripts/test-installer-upgrade.ps1 -Installer "dist/release/codex-mixin-${{ steps.version.outputs.value }}-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-windows
          path: dist
          if-no-files-found: error
