name: Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        shell: pwsh
        run: |
          $version = '15.1.0'
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $tools -Force
          $bin = Join-Path $tools "ripgrep-$version-x86_64-pc-windows-msvc"
          if (-not (Test-Path "$bin/rg.exe")) { throw 'Official ripgrep archive is missing rg.exe' }
          $bin >> $env:GITHUB_PATH
          & "$bin/rg.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'ripgrep could not run' }
      - run: cargo fmt --all -- --check
      - name: Run strict Clippy
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Check architecture boundaries
        shell: bash
        run: |
          ./scripts/check_arch.sh
          ./scripts/test_check_arch.sh
      - name: Check Anthropic endpoint isolation
        run: cargo test --locked --test gateway_http anthropic_messages_ignores_legacy_model_level_endpoint -- --nocapture
      - run: cargo test --locked --all-targets
  cli:
    name: Build Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cli
          path: target/release/codex-mixin.exe
          if-no-files-found: error

  native:
    name: WinUI 3 build and adapter tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test CLI adapter
        shell: pwsh
        run: dotnet run --project windows/Tests/Tests.csproj -c Release
      - name: Compile Windows UI Automation tests
        shell: pwsh
        run: dotnet build windows/UiTests/UiTests.csproj -c Release
      - name: Generate native icons
        shell: pwsh
        run: ./windows/scripts/generate-windows-assets.ps1
      - name: Compile and publish native UI
        shell: pwsh
        run: dotnet publish windows/CodexMixin/CodexMixin.csproj -c Release -p:Platform=x64 -o windows/build/publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-dependencies
          path: windows/CodexMixin/packages.lock.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-ui
          path: windows/build/publish
          if-no-files-found: error

  native-ui:
    name: Windows native UI and real CLI tests
    runs-on: windows-latest
    needs: [cli, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: target/release
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-ui
          path: windows/build/publish
      - name: Test real Rust CLI contracts
        shell: pwsh
        run: dotnet run --project windows/Tests/Tests.csproj -c Release -- --cli target/release/codex-mixin.exe
      - name: Stage real CLI alongside UI
        shell: pwsh
        run: Copy-Item target/release/codex-mixin.exe windows/build/publish/
      - name: Test native navigation, themes, tray and activation
        shell: pwsh
        run: dotnet run --project windows/UiTests/UiTests.csproj -c Release -- windows/build/publish/codex_mixin_ui.exe windows/build/ui-test-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-ui-evidence
          path: |
            windows/build/ui-test-artifacts/*.png
            windows/build/ui-test-artifacts/index.html
            windows/build/ui-test-artifacts/failure.txt
          retention-days: 14
          if-no-files-found: warn

  package:
    runs-on: windows-latest
    needs: [rust, native-ui]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # NSIS provides makensis for the standard installer built by the script.
      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: pwsh
      # Builds the Rust CLI + native WinUI 3 UI and packages the standard installer and
      # portable archive. Use the same relative dist\release layout as the
      # Release workflow so this job exercises the release packaging paths.
      - name: Package and optionally sign Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = ((cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'codex-mixin' } | Select-Object -First 1).version
          $options = @{
            Output = "dist\release\codex-mixin-$version-windows-x86_64"
            Installer = "dist\release\codex-mixin-$version-windows-x86_64-setup.exe"
            PortableArchive = "dist\release\codex-mixin-$version-windows-x86_64.zip"
            Version = $version
          }
          $pfx = $null
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codex-mixin.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $options.Sign = $true
            $options.CertificatePath = $pfx
            $options.CertificatePassword = $env:WINDOWS_CERT_PASSWORD
          }
          try {
            & windows/scripts/package-windows.ps1 @options
          } finally {
            if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }
      # Fail the job if either executable is missing from the package.
      - shell: pwsh
        run: |
          $version = ((cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'codex-mixin' } | Select-Object -First 1).version
          $app = "dist\release\codex-mixin-$version-windows-x86_64"
          if (-not (Test-Path "$app\codex-mixin.exe")) { throw 'codex-mixin.exe missing from package' }
          if (-not (Test-Path "$app\codex_mixin_ui.exe")) { throw 'codex_mixin_ui.exe missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64-setup.exe")) { throw 'Windows installer missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64.zip")) { throw 'Windows portable archive missing from package' }
      - uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-windows
          path: dist
          if-no-files-found: error
