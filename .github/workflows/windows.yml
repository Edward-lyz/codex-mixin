name: Windows

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: 'Optional successful Windows run to observe existing binaries (does not satisfy the merge gate)'
        type: string
        default: ''
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    if: ${{ !inputs.artifacts_run_id }}
    name: Rust (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - clippy
          - integration-a
          - integration-b
          - integration-c
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Clippy's metadata cannot replace compiled test dependencies.
          shared-key: windows-${{ matrix.shard == 'clippy' && 'clippy' || 'integration' }}
          # All test shards use the same features and dependency profile.
          # One writer seeds their cache; release has its own cache below.
          save-if: ${{ matrix.shard == 'clippy' || matrix.shard == 'integration-b' }}
      - name: Run strict Clippy
        if: matrix.shard == 'clippy'
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Run integration tests
        if: startsWith(matrix.shard, 'integration-')
        shell: pwsh
        run: ./scripts/test_windows_integration.ps1 -Shard ${{ matrix.shard }}
  cli:
    if: ${{ !inputs.artifacts_run_id }}
    name: Build Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-pc-windows-msvc
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cli
          path: target/release/codex-mixin.exe
          if-no-files-found: error

  native:
    if: ${{ !inputs.artifacts_run_id }}
    name: WPF build and adapter tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path scripts, windows/scripts -Recurse -Filter *.ps1
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed: $($script.FullName)"
            }
          }
      - name: Test portable automatic replacement
        shell: pwsh
        run: ./windows/scripts/test-portable-update.ps1
      - name: Generate native icons
        shell: pwsh
        run: ./windows/scripts/generate-windows-assets.ps1
      - name: Compile and publish native UI
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $version = [regex]::Match(
            $cargo, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if (-not $version) { throw 'Cargo package version is missing' }
          $numericVersion = ($version -split '-', 2)[0]
          dotnet publish windows/CodexMixin/CodexMixin.csproj -c Release `
            -p:Platform=x64 -p:Version=$numericVersion -o windows/build/publish
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-ui
          path: windows/build/publish
          if-no-files-found: error

  cli-contracts:
    if: ${{ !inputs.artifacts_run_id }}
    name: Real CLI contract tests
    runs-on: windows-latest
    needs: [cli]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: target/release
      - name: Test real Rust CLI contracts
        shell: pwsh
        run: dotnet run --project windows/Tests/Tests.csproj -c Release -- target/release/codex-mixin.exe

  ui-cli:
    name: ${{ inputs.artifacts_run_id && 'Windows UI observation' || 'Windows UI and CLI' }}
    if: ${{ always() && !cancelled() && (inputs.artifacts_run_id || (needs.cli.result == 'success' && needs.native.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [cli, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-ui
          path: windows-ui
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: windows-ui
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned Microsoft winapp
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winappcli-x64.zip'
          Invoke-WebRequest 'https://github.com/microsoft/winappCli/releases/download/v0.7.1/winappcli-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd925d1e32cdc320b6d271f653fd2cd3c05b5d7558deb20d1b548bead77900fcf') {
            throw 'Microsoft winapp archive hash mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'winapp'
          Expand-Archive $archive -DestinationPath $destination
          $tool = @(Get-ChildItem $destination -Recurse -Filter winapp.exe)
          if ($tool.Count -ne 1) { throw 'Expected exactly one winapp.exe' }
          "WINAPP_CLI=$($tool[0].FullName)" >> $env:GITHUB_ENV
      - name: Exercise native UI and real CLI
        shell: pwsh
        run: ./windows/scripts/test-ui-cli.ps1 -AppDirectory windows-ui -WinApp $env:WINAPP_CLI -EvidenceDirectory windows-ui-evidence
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-evidence
          path: windows-ui-evidence
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: windows-latest
    needs: [rust, cli, native, cli-contracts, ui-cli]
    steps:
      - uses: actions/checkout@v5
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $version = [regex]::Match(
            $cargo, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if (-not $version) { throw 'Cargo package version is missing' }
          "value=$version" >> $env:GITHUB_OUTPUT
      # Package the CLI built by the cli job instead of rebuilding it.
      - uses: actions/download-artifact@v7
        with:
          name: windows-cli
          path: windows-cli
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-ui
          path: windows-ui
      # NSIS provides makensis for the standard installer built by the script.
      - name: Install NSIS
        run: ./windows/scripts/install-nsis.ps1
        shell: pwsh
      # Reuses the tested CLI and native UI artifacts, then exercises the same
      # installer and portable archive paths as the release workflow.
      - name: Package and optionally sign Windows artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:VERSION
          $options = @{
            Output = "dist\release\codex-mixin-$version-windows-x86_64"
            Installer = "dist\release\codex-mixin-$version-windows-x86_64-setup.exe"
            PortableArchive = "dist\release\codex-mixin-$version-windows-x86_64.zip"
            Version = $version
            CliPath = 'windows-cli\codex-mixin.exe'
            UiPath = 'windows-ui'
            SkipCliTests = $true
          }
          $pfx = $null
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codex-mixin.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $options.Sign = $true
            $options.CertificatePath = $pfx
            $options.CertificatePassword = $env:WINDOWS_CERT_PASSWORD
          }
          try {
            & windows/scripts/package-windows.ps1 @options
          } finally {
            if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }
      # Fail the job if either executable is missing from the package.
      - shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $app = "dist\release\codex-mixin-$version-windows-x86_64"
          if (-not (Test-Path "$app\codex-mixin.exe")) { throw 'codex-mixin.exe missing from package' }
          if (-not (Test-Path "$app\codex_mixin_ui.exe")) { throw 'codex_mixin_ui.exe missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64-setup.exe")) { throw 'Windows installer missing from package' }
          if (-not (Test-Path "dist\release\codex-mixin-$version-windows-x86_64.zip")) { throw 'Windows portable archive missing from package' }
      - name: Test complete installer upgrade and startup preservation
        shell: pwsh
        run: ./windows/scripts/test-installer-upgrade.ps1 -Installer "dist/release/codex-mixin-${{ steps.version.outputs.value }}-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-windows
          path: dist
          if-no-files-found: error
