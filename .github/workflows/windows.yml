name: Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  flutter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: powershell -File scripts/generate-windows-assets.ps1
      - run: powershell -File scripts/patch-window-manager.ps1 -UiRoot .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

  package:
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # NSIS provides makensis for the standard installer built by the script.
      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: pwsh
      # Builds the Rust CLI + Flutter UI, assembles dist/codex-mixin-windows,
      # and produces the standard installer dist/CodexMixin-Setup.exe.
      - run: powershell -ExecutionPolicy Bypass -File windows/scripts/package-windows.ps1
      # Fail the job if either executable is missing from the package.
      - shell: pwsh
        run: |
          if (-not (Test-Path 'dist/codex-mixin-windows/codex-mixin.exe')) { throw 'codex-mixin.exe missing from package' }
          if (-not (Test-Path 'dist/codex-mixin-windows/codex_mixin_ui.exe')) { throw 'codex_mixin_ui.exe missing from package' }
      # Authenticode signing requires a certificate provided via repository
      # secrets; it is skipped automatically when the secret is absent so forks
      # and PRs still build. Provide WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD
      # to enable signed release artifacts.
      - name: Sign executables
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'codex-mixin.pfx')
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          foreach ($exe in @('dist/codex-mixin-windows/codex-mixin.exe', 'dist/codex-mixin-windows/codex_mixin_ui.exe')) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            & $signtool.FullName verify /pa $exe
          }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: codex-mixin-windows
          path: dist
          if-no-files-found: error
