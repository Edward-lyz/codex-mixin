name: Build

# Manual runs always build the latest main. Release calls the same jobs with
# its tag commit, so packaging logic exists only here.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-aarch64
          - macos-x86_64
          - windows-x86_64
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Package version without the v prefix"
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      unix: ${{ steps.plan.outputs.unix }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: plan
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          all='[
            {"name":"linux-x86_64","os":"linux","runner":"ubuntu-latest","target":"x86_64-unknown-linux-musl","deb_arch":"amd64"},
            {"name":"linux-aarch64","os":"linux","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","deb_arch":"arm64"},
            {"name":"macos-x86_64","os":"macos","runner":"macos-26-intel","target":"x86_64-apple-darwin"},
            {"name":"macos-aarch64","os":"macos","runner":"macos-26","target":"aarch64-apple-darwin"}
          ]'
          include="$(jq -c --arg p "$PLATFORM" '[.[] | select($p == "all" or .name == $p)]' <<<"$all")"
          windows=false
          if [[ "$PLATFORM" == "all" || "$PLATFORM" == "windows-x86_64" ]]; then
            windows=true
          fi
          if [[ "$include" == "[]" && "$windows" == "false" ]]; then
            echo "unknown platform: $PLATFORM" >&2
            exit 1
          fi
          # Pin one commit so every platform builds the same source even if
          # main moves while the jobs queue.
          ref="$(git rev-parse HEAD)"
          version="$VERSION"
          if [[ -z "$version" ]]; then
            version="$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "codex-mixin") | .version')"
          fi
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "matrix={\"include\":$include}"
            echo "unix=$([[ "$include" == "[]" ]] && echo false || echo true)"
            echo "windows=$windows"
          } >>"$GITHUB_OUTPUT"
          echo "building $ref as $version for $PLATFORM"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.unix == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build CLI
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export CC_aarch64_unknown_linux_musl=musl-gcc
          fi
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify static Linux CLI
        if: matrix.os == 'linux'
        run: ./scripts/verify-linux-static.sh "target/${{ matrix.target }}/release/codex-mixin"
      - name: Select Xcode 26.6
        if: matrix.os == 'macos'
        shell: bash
        run: |
          xcode_path=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "required Xcode is missing: $xcode_path" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcode_version="$(xcodebuild -version)"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 26.6" ]]; then
            echo "failed to select Xcode 26.6" >&2
            echo "$xcode_version" >&2
            exit 1
          fi
      - name: Build macOS app
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "13.1"
          CODEX_MIXIN_REFRESH_NASA_WALLPAPERS: "1"
          CODEX_MIXIN_REQUIRE_ADAPTIVE_ICON: "1"
        run: ./macos/build_app.sh
      - name: Verify macOS application icons
        if: matrix.os == 'macos'
        run: ./scripts/verify_macos_app_icon.sh --require-adaptive
      - name: Verify macOS SDK and Liquid Glass
        if: matrix.os == 'macos'
        shell: bash
        run: |
          menu_binary="dist/Codex Mixin.app/Contents/MacOS/CodexMixinMenu"
          sdk_version="$(xcrun vtool -show-build "$menu_binary" | awk '$1 == "sdk" { print $2; exit }')"
          if [[ "${sdk_version%%.*}" != "26" ]]; then
            echo "expected macOS SDK 26, got ${sdk_version:-missing}" >&2
            exit 1
          fi
          symbols="$(nm -u "$menu_binary")"
          if [[ "$symbols" != *"GlassProminentButtonStyle"* ]]; then
            echo "Liquid Glass button style is missing from the macOS app" >&2
            exit 1
          fi
      - name: Package CLI archive
        run: ./scripts/package-cli.sh "${{ matrix.target }}" "$VERSION" dist/release
      - name: Package Linux installer
        if: matrix.os == 'linux'
        run: ./scripts/package-linux-deb.sh "${{ matrix.target }}" "${{ matrix.deb_arch }}" "$VERSION" dist/release
      - name: Package macOS installer
        if: matrix.os == 'macos'
        run: ./scripts/package-macos-dmg.sh "${{ matrix.target }}" "$VERSION" dist/release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        shell: pwsh
        run: ./windows/scripts/install-nsis.ps1
      - name: Build, test, package, and optionally sign
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:VERSION
          $options = @{
            Output = "dist\release\codex-mixin-$version-windows-x86_64"
            Installer = "dist\release\codex-mixin-$version-windows-x86_64-setup.exe"
            PortableArchive = "dist\release\codex-mixin-$version-windows-x86_64.zip"
            Version = $version
          }
          $pfx = $null
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codex-mixin.pfx'
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $options.Sign = $true
            $options.CertificatePath = $pfx
            $options.CertificatePassword = $env:WINDOWS_CERT_PASSWORD
          }
          try {
            & windows/scripts/package-windows.ps1 @options
          } finally {
            if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }
      - name: Package standalone Windows CLI
        shell: pwsh
        run: |
          $version = $env:VERSION
          $name = "codex-mixin-cli-$version-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/release/codex-mixin-$version-windows-x86_64/codex-mixin.exe" $stage
          Copy-Item README.md, LICENSE, NOTICE $stage
          tar -czf "dist/release/$name.tar.gz" -C $env:RUNNER_TEMP $name
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI packaging failed' }
      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = $env:VERSION
          foreach ($path in @(
            "dist\release\codex-mixin-$version-windows-x86_64-setup.exe",
            "dist\release\codex-mixin-$version-windows-x86_64.zip"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows release artifact: $path"
            }
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-windows-x86_64
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.tar.gz
          if-no-files-found: error
