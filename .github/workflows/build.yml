name: Build

# Manual runs build the head of the branch they are dispatched on. Release
# calls the same jobs with its tag commit, so packaging logic exists only here.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-aarch64
          - macos-x86_64
          - windows-x86_64
          - windows-aarch64
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Package version without the v prefix"
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      unix: ${{ steps.plan.outputs.unix }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: plan
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          all='[
            {"name":"linux-x86_64","os":"linux","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","deb_arch":"amd64"},
            {"name":"linux-aarch64","os":"linux","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","deb_arch":"arm64"},
            {"name":"macos-x86_64","os":"macos","runner":"macos-26-intel","target":"x86_64-apple-darwin"},
            {"name":"macos-aarch64","os":"macos","runner":"macos-26","target":"aarch64-apple-darwin"}
          ]'
          include="$(jq -c --arg p "$PLATFORM" '[.[] | select($p == "all" or .name == $p)]' <<<"$all")"
          windows='[
            {"name":"windows-x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"name":"windows-aarch64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          windows_include="$(jq -c --arg p "$PLATFORM" '[.[] | select($p == "all" or .name == $p)]' <<<"$windows")"
          if [[ "$include" == "[]" && "$windows_include" == "[]" ]]; then
            echo "unknown platform: $PLATFORM" >&2
            exit 1
          fi
          # Pin one commit so every platform builds the same source even if
          # main moves while the jobs queue.
          ref="$(git rev-parse HEAD)"
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "codex-mixin") | .version')"
          if [[ -n "$VERSION" && "$VERSION" != "$version" ]]; then
            echo "requested version $VERSION does not match workspace version $version" >&2
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "matrix={\"include\":$include}"
            echo "unix=$([[ "$include" == "[]" ]] && echo false || echo true)"
            echo "windows=$([[ "$windows_include" == "[]" ]] && echo false || echo true)"
            echo "windows_matrix={\"include\":$windows_include}"
          } >>"$GITHUB_OUTPUT"
          echo "building $ref as $version for $PLATFORM"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.unix == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install musl linker and desktop libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - name: Refresh bundled models.dev snapshot
        shell: bash
        run: ./scripts/update_models_dev_snapshot.sh || echo "::warning::models.dev unreachable; bundling the committed snapshot"
      - name: Build CLI
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export CC_aarch64_unknown_linux_musl=musl-gcc
          fi
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify static Linux CLI
        if: matrix.os == 'linux'
        run: ./scripts/verify-linux-static.sh "target/${{ matrix.target }}/release/codex-mixin"
      - name: Select Xcode 26.6
        if: matrix.os == 'macos'
        shell: bash
        run: |
          xcode_path=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "required Xcode is missing: $xcode_path" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcode_version="$(xcodebuild -version)"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 26.6" ]]; then
            echo "failed to select Xcode 26.6" >&2
            echo "$xcode_version" >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: matrix.os == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "no Developer ID certificate configured; the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
      - name: Build macOS app
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "13.1"
          CODEX_MIXIN_REQUIRE_ADAPTIVE_ICON: "1"
          # Ad-hoc signing unless a Developer ID certificate is configured.
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$NOTARY_KEY_BASE64" ]]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          fi
          ./desktop/macos/build_app.sh
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Verify macOS application icons
        if: matrix.os == 'macos'
        run: ./scripts/verify_macos_app_icon.sh --require-adaptive
      - name: Package signed update archive
        if: matrix.os == 'macos'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p dist/release
          archive="dist/release/codex-mixin-app-$VERSION-${{ matrix.target }}.zip"
          ditto -c -k --keepParent "dist/Codex Mixin.app" "$archive"
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the update archive is unsigned and the app will reject it"
            exit 0
          fi
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl" ./scripts/sign_update.sh "$archive"
      - name: Package CLI archive
        run: ./scripts/package-cli.sh "${{ matrix.target }}" "$VERSION" dist/release
      - name: Package Linux installer
        if: matrix.os == 'linux'
        run: ./scripts/package-linux-deb.sh "${{ matrix.target }}" "${{ matrix.deb_arch }}" "$VERSION" dist/release
      - name: Build and package the Linux desktop app
        if: matrix.os == 'linux'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          ./desktop/linux/package.sh "${{ matrix.target }}" "$VERSION" dist/release
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the update archive is unsigned and the app will reject it"
            exit 0
          fi
          target="${{ matrix.target }}"
          ./scripts/sign_update.sh "dist/release/codex-mixin-app-$VERSION-${target%-musl}-gnu.tar.gz"
      - name: Package macOS installer
        if: matrix.os == 'macos'
        run: ./scripts/package-macos-dmg.sh "${{ matrix.target }}" "$VERSION" dist/release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Refresh bundled models.dev snapshot
        shell: bash
        run: ./scripts/update_models_dev_snapshot.sh || echo "::warning::models.dev unreachable; bundling the committed snapshot"
      - name: Install NSIS
        shell: pwsh
        run: ./desktop/windows/install-nsis.ps1
      - name: Build and package the desktop app
        shell: pwsh
        run: ./desktop/windows/package.ps1 -Target $env:TARGET -OutDirectory dist/release -Installer
      - name: Sign the update archive
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the update archive is unsigned and the app will reject it"
            exit 0
          fi
          ./scripts/sign_update.sh "dist/release/codex-mixin-app-$VERSION-$TARGET.zip"
      - name: Package standalone Windows CLI
        shell: pwsh
        run: |
          $version = $env:VERSION
          $name = "codex-mixin-cli-$version-$env:TARGET"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/codex-mixin.exe" $stage
          Copy-Item README.md, LICENSE, NOTICE $stage
          tar -czf "dist/release/$name.tar.gz" -C $env:RUNNER_TEMP $name
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI packaging failed' }
      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = $env:VERSION
          foreach ($path in @(
            "dist\release\codex-mixin-$version-$env:PLATFORM.zip",
            "dist\release\codex-mixin-$version-$env:PLATFORM-setup.exe",
            "dist\release\codex-mixin-app-$version-$env:TARGET.zip",
            "dist\release\codex-mixin-cli-$version-$env:TARGET.tar.gz"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows release artifact: $path"
            }
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-${{ matrix.name }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.sig
            dist/release/*.tar.gz
          if-no-files-found: error
