name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, script parsing, and architecture checks are platform-neutral.
  # Keep them on one runner and use the saved macOS minutes for platform tests.
  linux:
    name: Linux checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check script syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts macos -type f -name '*.sh' -print)
          while IFS= read -r script; do
            node --check "$script"
          done < <(find scripts panel/assets -type f \
            \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print)
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path("scripts").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
      - name: Run strict Clippy
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Install ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null; then
            exit 0
          fi
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install ripgrep
          else
            echo "unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
          fi
      - name: Check architecture boundaries
        run: |
          ./scripts/check_arch.sh
          ./scripts/test_check_arch.sh
      - name: Run unit and integration tests
        run: cargo test --locked --all-targets
      - name: Run client auth Clippy
        run: |
          cargo clippy --locked --all-targets --features client-auth -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Run client auth tests
        run: cargo test --locked --all-targets --features client-auth
      - name: Run prompt cache prefix E2E
        run: ./scripts/e2e_prompt_cache.sh
      - name: Build static Linux CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --locked --release --target x86_64-unknown-linux-musl
          ./scripts/verify-linux-static.sh target/x86_64-unknown-linux-musl/release/codex-mixin
      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-mixin-linux-cli-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/codex-mixin
          if-no-files-found: error

  macos-rust:
    name: Rust checks and tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run strict Clippy
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Run unit and integration tests
        run: cargo test --locked --all-targets

  # The release build and Swift suite take several minutes. Run them beside
  # the macOS Rust checks so neither job waits for the other.
  macos-app:
    name: macOS app and Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null; then
            exit 0
          fi
          brew install ripgrep
      - name: Build macOS app
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.1"
          CODEX_MIXIN_REQUIRE_ADAPTIVE_ICON: "1"
        run: ./macos/build_app.sh
      - name: Verify macOS application icons
        run: ./scripts/verify_macos_app_icon.sh
      - name: Run macOS Swift tests
        run: ./scripts/test_macos.sh
