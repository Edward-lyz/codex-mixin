name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check script syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts macos -type f -name '*.sh' -print)
          while IFS= read -r script; do
            node --check "$script"
          done < <(find scripts panel/assets -type f \
            \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print)
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path("scripts").rglob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
      - name: Run strict Clippy
        run: |
          cargo clippy --locked --all-targets -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      # Tests and the macOS app build shell out to `rg`; the static CLI build
      # needs the musl toolchain. One `apt-get update` covers both.
      - name: Install test dependencies
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes jq ripgrep musl-tools
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            command -v rg >/dev/null || brew install ripgrep
          else
            echo "unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
          fi
      - name: Check architecture boundaries
        if: runner.os == 'Linux'
        run: ./scripts/check_arch.sh
      - name: Run E2E tests
        run: cargo test --locked --tests
      - name: Run multi-provider E2E
        if: runner.os == 'Linux'
        run: ./scripts/e2e_multi_provider.sh
      - name: Run client auth Clippy
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --all-targets --features client-auth -- \
            -D clippy::cognitive_complexity \
            -D clippy::redundant_closure_for_method_calls \
            -D clippy::redundant_pattern_matching \
            -D warnings
      - name: Run client auth tests
        if: runner.os == 'Linux'
        run: ./scripts/test_client_auth.sh
      - name: Run prompt cache prefix E2E
        if: runner.os == 'Linux'
        run: ./scripts/e2e_prompt_cache.sh
      - name: Build static Linux CLI
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --locked --release --target x86_64-unknown-linux-musl
          ./scripts/verify-linux-static.sh target/x86_64-unknown-linux-musl/release/codex-mixin
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.1"
          CODEX_MIXIN_REQUIRE_ADAPTIVE_ICON: "1"
        run: ./macos/build_app.sh
      - name: Verify macOS application icons
        if: runner.os == 'macOS'
        run: ./scripts/verify_macos_app_icon.sh
