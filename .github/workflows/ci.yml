name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit and integration tests
        run: cargo test --locked --all-targets
      - name: Run prompt cache prefix E2E
        run: ./scripts/e2e_prompt_cache.sh
      - name: Build static Linux CLI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --locked --release --target x86_64-unknown-linux-musl
          ./scripts/verify-linux-static.sh target/x86_64-unknown-linux-musl/release/codex-mixin
      - name: Upload Linux CLI artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: codex-mixin-linux-cli-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/codex-mixin
          if-no-files-found: error
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.1"
        run: ./macos/build_app.sh
      - name: Test macOS About window and install card
        if: runner.os == 'macOS'
        run: |
          ./scripts/test_about_window.sh
          ./scripts/test_install_card.sh
      - name: Test macOS DUCC setup flow
        if: runner.os == 'macOS'
        run: ./scripts/test_provider_settings_navigation.sh
      - name: Test macOS DUCC managed installation
        if: runner.os == 'macOS'
        run: ./scripts/test_ducc_managed_install.sh
      - name: Test macOS process output collection
        if: runner.os == 'macOS'
        run: ./scripts/test_process_output_collector.sh
      - name: Test macOS status refresh coordination
        if: runner.os == 'macOS'
        run: ./scripts/test_status_refresh_coordinator.sh
