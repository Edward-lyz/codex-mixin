name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - name: linux-aarch64
            os: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
          - name: macos-x86_64
            os: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos
            runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
      - name: Build CLI
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export CC_aarch64_unknown_linux_musl=musl-gcc
          fi
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify static Linux CLI
        if: matrix.os == 'linux'
        run: ./scripts/verify-linux-static.sh "target/${{ matrix.target }}/release/codex-mixin"
      - name: Build macOS app
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "13.1"
          CODEX_MIXIN_REFRESH_NASA_WALLPAPERS: "1"
        run: ./macos/build_app.sh
      - name: Package CLI archive
        run: ./scripts/package-cli.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}" dist/release
      - name: Package Linux installer
        if: matrix.os == 'linux'
        run: ./scripts/package-linux-deb.sh "${{ matrix.target }}" "${{ matrix.deb_arch }}" "${{ steps.version.outputs.version }}" dist/release
      - name: Package macOS installer
        if: matrix.os == 'macos'
        run: ./scripts/package-macos-dmg.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}" dist/release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-mixin-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Prepare current release notes
        shell: bash
        run: |
          awk '
            /^<!-- codex-mixin:zh-Hans:start -->$/ {
              section += 1
              if (section == 2) exit
            }
            section == 1 { print }
          ' RELEASE_NOTES.md > .current-release-notes.md
          heading_count="$(grep -Fxc "## ${{ steps.version.outputs.tag }}" .current-release-notes.md)"
          if [[ "$heading_count" != "3" ]]; then
            echo "expected three localized headings for ${{ steps.version.outputs.tag }}, found $heading_count" >&2
            exit 1
          fi
      - name: Generate signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "missing required SPARKLE_PRIVATE_KEY repository secret" >&2
            exit 1
          fi
          sparkle_dir="$(./scripts/fetch_sparkle.sh)"
          appcast_dir="$RUNNER_TEMP/codex-mixin-appcast"
          rm -rf "$appcast_dir"
          mkdir -p "$appcast_dir"
          find dist/release -maxdepth 1 -type f -name '*.dmg' -exec cp {} "$appcast_dir/" \;
          dmg_count="$(find "$appcast_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
          if [[ "$dmg_count" != "2" ]]; then
            echo "expected two macOS DMGs for the appcast, found $dmg_count" >&2
            exit 1
          fi
          for dmg in "$appcast_dir"/*.dmg; do
            cp .current-release-notes.md "${dmg%.dmg}.md"
          done
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/Edward-lyz/codex-mixin/releases/download/${{ steps.version.outputs.tag }}/" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --link "https://github.com/Edward-lyz/codex-mixin/releases/tag/${{ steps.version.outputs.tag }}" \
            -o "$appcast_dir/appcast.xml" \
            "$appcast_dir"
          xmllint --noout "$appcast_dir/appcast.xml"
          for dmg in "$appcast_dir"/*.dmg; do
            grep -Fq "$(basename "$dmg")" "$appcast_dir/appcast.xml"
          done
          grep -Fq 'sparkle:edSignature=' "$appcast_dir/appcast.xml"
          cp "$appcast_dir/appcast.xml" dist/release/appcast.xml
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Codex Mixin ${{ steps.version.outputs.tag }}
          body_path: .current-release-notes.md
          files: dist/release/*
