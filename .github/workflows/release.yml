name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true
      - name: Prepare current release notes
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"
          # Publish only the current version. The zh-Hans block holds every
          # version, so select the section headed by the release tag and stop
          # at the next version heading.
          awk -v heading="## $tag" '
            /^<!-- codex-mixin:[A-Za-z-]+:start -->$/ {
              locale = $0
              sub(/^<!-- codex-mixin:/, "", locale)
              sub(/:start -->$/, "", locale)
              next
            }
            /^<!-- codex-mixin:[A-Za-z-]+:end -->$/ { locale = ""; emit = 0; next }
            locale == "zh-Hans" && $0 == heading { emit = 1 }
            locale == "zh-Hans" && emit && /^## / && $0 != heading { emit = 0 }
            locale == "zh-Hans" && emit { print }
          ' RELEASE_NOTES.md > .current-release-notes.md

          source_count="$(grep -Fxc "## $tag" RELEASE_NOTES.md || true)"
          if [[ "$source_count" != "3" ]]; then
            echo "expected three localized headings for $tag in RELEASE_NOTES.md, found ${source_count:-0}" >&2
            exit 1
          fi
          output_count="$(grep -Fxc "## $tag" .current-release-notes.md || true)"
          version_count="$(grep -Ec '^## v' .current-release-notes.md || true)"
          if [[ "$output_count" != "1" || "$version_count" != "1" ]]; then
            echo "expected only the $tag section in the release notes, found ${output_count:-0} tag headings and ${version_count:-0} version headings" >&2
            exit 1
          fi
      - name: Verify desktop update signatures
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          version="${{ needs.version.outputs.version }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-pc-windows-msvc x86_64-pc-windows-msvc \
            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            extension=zip
            if [[ "$target" == *-linux-gnu ]]; then
              extension=tar.gz
            fi
            archive="codex-mixin-app-$version-$target.$extension"
            test -s "$archive" && test -s "$archive.sig" || {
              echo "missing desktop update archive or signature: $archive" >&2
              exit 1
            }
          done
      - name: Sign macOS update feeds for Sparkle clients
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?missing SPARKLE_PRIVATE_KEY for 0.x macOS clients}"
          sparkle_dir="$(./scripts/fetch_sparkle.sh)"
          appcasts="$(mktemp -d)"
          trap 'rm -rf "$appcasts"' EXIT
          releases="https://github.com/Edward-lyz/codex-mixin/releases"
          for arch in aarch64 x86_64; do
            mkdir "$appcasts/$arch"
            dmg="codex-mixin-$VERSION-$arch-apple-darwin.dmg"
            cp "dist/release/$dmg" "$appcasts/$arch/"
            cp .current-release-notes.md "$appcasts/$arch/${dmg%.dmg}.md"
            printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" \
              --ed-key-file - --download-url-prefix "$releases/download/$RELEASE_TAG/" \
              --embed-release-notes --maximum-deltas 0 --link "$releases/tag/$RELEASE_TAG" \
              -o "dist/release/appcast-$arch.xml" "$appcasts/$arch"
            xmllint --noout "dist/release/appcast-$arch.xml"
            test "$(grep -c '<item>' "dist/release/appcast-$arch.xml")" = 1
            grep -Fq "$dmg" "dist/release/appcast-$arch.xml"
            grep -Fq 'sparkle:edSignature=' "dist/release/appcast-$arch.xml"
          done
          # Older releases share a feed and rely on the arm64 hardware requirement.
          awk '/<item>/{copy=1} copy{print} /<\/item>/{exit}' \
            dist/release/appcast-x86_64.xml > "$appcasts/intel.xml"
          awk -v item="$appcasts/intel.xml" '
            /<\/channel>/ { while ((getline line < item) > 0) print line }
            { print }
          ' dist/release/appcast-aarch64.xml > dist/release/appcast.xml
          xmllint --noout dist/release/appcast.xml
          test "$(grep -c 'sparkle:edSignature=' dist/release/appcast.xml)" = 2
          first_arch="$(xmllint --xpath 'string(/rss/channel/item[1]/*[local-name()="hardwareRequirements"])' dist/release/appcast.xml)"
          if [[ "$first_arch" != arm64 ]]; then
            echo "expected the ARM64 update first in the combined Sparkle feed" >&2
            exit 1
          fi
      - name: Write package manager manifests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-managers.sh "${{ needs.version.outputs.version }}" dist/release "$RUNNER_TEMP/pm"
          cp -R "$RUNNER_TEMP/pm/Formula" "$RUNNER_TEMP/pm/Casks" .
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist/release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort \
            | xargs shasum -a 256 > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Codex Mixin ${{ needs.version.outputs.tag }}
          body_path: .current-release-notes.md
          files: dist/release/*
      - name: Update Homebrew formula and cask on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B homebrew-update origin/main
          git add Formula Casks
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "brew: codex-mixin ${{ needs.version.outputs.version }}"
          git push origin HEAD:main

  docker:
    name: Publish container image
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Download Linux CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: codex-mixin-linux-*
          path: dist/release
          merge-multiple: true
      - name: Extract binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}" target="${pair#*:}-unknown-linux-musl"
            mkdir -p "dist/docker/$arch"
            tar -xzf "dist/release/codex-mixin-cli-$version-$target.tar.gz" \
              -C "dist/docker/$arch" --strip-components=1 "codex-mixin-cli-$version-$target/codex-mixin"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/edward-lyz/codex-mixin:${{ needs.version.outputs.version }}
            ghcr.io/edward-lyz/codex-mixin:latest
