[package]
name = "codex-mixin"
version = "0.5.3"
edition = "2024"
license-file = "LICENSE"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
memchr = "2.8"
percent-encoding = "2.3"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
regex = "1.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-tungstenite-proxy = { package = "tokio-tungstenite", git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["proxy", "rustls-tls-webpki-roots"] }
toml_edit = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["decompression-zstd"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "v5"] }
wait-timeout = "0.2"
walkdir = "2.5"
indicatif = "0.18.6"
console = "0.16.4"
crossterm = "0.28.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
http-body-util = "0.1"
